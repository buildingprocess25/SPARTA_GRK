name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:latest
            ghcr.io/${{ env.REPO }}:${{ github.sha }}
          # NEXT_PUBLIC_* variables are inlined into the client bundle at
          # build time - Dokploy's "Environment" tab only sets runtime env
          # vars for the already-built image it pulls from ghcr.io, so it has
          # no effect on these. They must be passed here instead, sourced
          # from GitHub Actions secrets/variables (Repo Settings > Secrets and
          # variables > Actions). VAPID_PRIVATE_KEY/AUTH_*/CRON_SECRET etc.
          # are runtime-only and stay in Dokploy's Environment tab as before.
          build-args: |
            NEXT_PUBLIC_NOTIFICATIONS_ENABLED=${{ vars.NEXT_PUBLIC_NOTIFICATIONS_ENABLED || 'true' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Trigger Deployment Webhook (Dokploy)
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK" ]; then
            curl -X POST "$DOKPLOY_WEBHOOK"
          else
            echo "DOKPLOY_WEBHOOK is not set, skipping webhook trigger."
          fi
